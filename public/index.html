<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Tank Trouble Online</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section id="screen-home" class="screen active">
    <h1>🎮 Tank Trouble Online</h1>
    <div class="card">
      <label for="nickname">닉네임</label>
      <input id="nickname" maxlength="12" placeholder="닉네임을 입력하세요" autocomplete="off" />

      <div class="row">
        <input id="joinCode" maxlength="4" placeholder="초대 코드" autocomplete="off" style="text-transform:uppercase" />
        <button id="btnJoin">참가하기</button>
      </div>

      <div class="divider">또는</div>

      <button id="btnCreate" class="primary">방 만들기</button>
    </div>
    <p id="homeError" class="error"></p>
  </section>

  <section id="screen-room" class="screen">
    <h2>초대 코드: <span id="roomCode">----</span> <button id="btnCopy" title="복사">복사</button></h2>
    <div id="playerList" class="player-list"></div>

    <div class="map-select">
      <h3>맵 선택</h3>
      <div id="mapButtons" class="map-buttons"></div>
    </div>

    <div class="settings-panel">
      <h3>⚙️ 게임 설정 (방장 전용)</h3>
      <div class="setting-row">
        <label><span>탱크 속도</span><span id="valSpeed">100%</span></label>
        <input type="range" id="setSpeed" min="50" max="200" value="100" step="5" />
      </div>
      <div class="setting-row">
        <label><span>연사 속도</span><span id="valFireRate">100%</span></label>
        <input type="range" id="setFireRate" min="50" max="250" value="100" step="5" />
      </div>
      <div class="setting-row">
        <label><span>총알 속도</span><span id="valBulletSpeed">100%</span></label>
        <input type="range" id="setBulletSpeed" min="50" max="200" value="100" step="5" />
      </div>
      <div class="setting-row">
        <label><span>탱크 목숨</span><span id="valLives">1</span></label>
        <input type="range" id="setLives" min="1" max="20" value="1" step="1" />
      </div>
    </div>

    <div class="settings-panel">
      <h3>🔍 내 화면 설정</h3>
      <div class="setting-row">
        <label><span>시야 범위 (FOV)</span><span id="valFov">100%</span></label>
        <input type="range" id="setFov" min="70" max="180" value="100" step="5" />
      </div>
    </div>

    <div class="room-actions">
      <button id="btnReady" class="primary">준비완료</button>
      <button id="btnLeave">나가기</button>
    </div>
    <p id="roomStatus" class="status"></p>
  </section>

  <section id="screen-game" class="screen">
    <div class="game-wrap">
      <canvas id="gameCanvas" width="900" height="600"></canvas>
      <div id="countdownOverlay" class="overlay hidden"></div>
      <div id="roundOverOverlay" class="overlay hidden"></div>
      <div id="mobileControls" class="mobile-controls hidden">
        <div id="joystickZone" class="joystick-zone">
          <div id="joystickKnob" class="joystick-knob"></div>
        </div>
        <button id="fireButton" class="fire-button">발사</button>
      </div>
    </div>
    <p class="controls-hint">이동: <b>W A S D</b>　발사: <b>Space</b>　(모바일: 조이스틱 + 발사 버튼)</p>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
